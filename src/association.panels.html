<template id="a-association-template"><section class="section" id="attendance-associations"><div class="section-head"><div><div class="section-number">ASSOCIATIONS / EFFECT SIZES</div><h2>The number, its meaning, and the decision</h2><p class="sub">Whole-dataset results, n = 1,500. These estimates stay fixed when cohort filters change.</p></div><button class="btn technical-toggle" aria-pressed="false">Show technical detail</button></div><div class="stat-definition"><strong>A correlation is a relationship measure, not a quality score.</strong> For <strong>r</strong>, zero means little straight-line relationship; values nearer +1 or −1 indicate a stronger positive or negative relationship. For <strong>V</strong>, zero means little association between categories; it has no positive/negative direction.</div><div id="a-association-cards" class="association-grid"></div><div class="adjusted-grid"><article class="adjusted-card"><h3>Does lead time matter after allowing for tenure?</h3><div id="a-partial-lead"></div></article><article class="adjusted-card"><h3>Compare AM and PM with a similar tenure mix</h3><div id="a-adjusted-time"></div></article></div><article class="card" style="margin-top:17px"><h3>Class categories with the same membership-tenure mix</h3><p class="desc">Standardization gives every category the same mix of newer and longer-standing bookings. It is a descriptive adjustment, not a forecast.</p><div id="a-standardized-table" class="heat-wrap" tabindex="0" role="region" aria-label="Tenure-standardized attendance comparisons"></div><p id="a-standardized-reading" class="association-note"></p><details class="technical-detail"><summary>Technical method and remaining limits</summary><div class="technical-method">Five tenure strata: 1–6, 7–12, 13–24, 25–48, 49+ months. Standardized rate = Σ(full-dataset stratum weight × within-category attendance rate). Intervals use 1,000 resamples inside category × tenure cells, holding the stratum weights fixed. Intervals are withheld where any cell has fewer than five bookings; the cutoff is a reporting guard, not a statistical validity threshold. Unmeasured member history, exact session schedules, nonlinear tenure effects and repeated-member dependence remain unresolved.</div></details></article><p class="association-note">The estimates describe this sample. They do not establish causality or validate a model for Optimo. The confidence range shows resampling uncertainty under the stated assumptions; it is not a guaranteed range for another gym.</p></section></template>
<template id="b-association-template"><section class="section" id="membership-associations"><div class="section-head"><div><div class="section-number">02 / ASSOCIATIONS EXPLAINED</div><h2>Understand the association before acting</h2><p class="sub">Whole-dataset synthetic sample, n = 1,000. These results stay fixed when cohort filters change.</p></div><button class="btn technical-toggle" aria-pressed="false">Show technical detail</button></div><div class="stat-definition"><strong>V measures how much categories are associated.</strong> A value near zero means the groups look broadly alike in the measured outcome. It is not a percentage, prediction accuracy, or proof that a service changes behavior.</div><div id="b-association-cards" class="association-grid"></div><article class="adjusted-card" style="margin-top:17px"><h3>What does a lift of 1.12 mean for Pilates and Yoga?</h3><div id="b-lift-explanation"></div><details class="technical-detail"><summary>Technical method</summary><div class="technical-method">Pair lift = P(Pilates and Yoga) / [P(Pilates) × P(Yoga)]. Base population: 503 group participants, each counted once. A 95% percentile interval resamples member preference sets 1,000 times. This displayed example was selected during exploration, so its interval is not adjusted for pair selection or multiple comparisons. No causal or cross-sell uplift claim is made.</div></details></article><div class="source-confirmation"><strong>Verified source: synthetic demonstration data.</strong> The original author, Tarek Adam, describes this as simulated gym membership data for EDA and machine learning. The Kaggle card lists CC0: Public Domain. This establishes the educational purpose; it does not make the generated relationships representative of real members. <a href="https://www.kaggle.com/datasets/ka66ledata/gym-membership-dataset" target="_blank" rel="noopener">Read the original data card ↗</a></div><p class="association-note">Synthetic data demonstrates analytical technique. The pattern estimates and their confidence ranges belong to this artificial sample. Real programming decisions require local member and class records.</p></section></template>
